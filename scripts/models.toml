# Model registry — the single source of truth for the convert/build/bench harness.
#
# Adding a model is three edits:
#   1. crates/colibri-core/src/config.rs  — a new `Arch` variant + config.json detection
#   2. crates/colibri-engine/src/convert.rs — the per-arch tensor mapping
#   3. this file                            — one [<name>] block
# After that, `scripts/pipeline.sh <name>` (convert -> build -> bench) just works,
# and every measurement script takes <name> instead of a hardcoded path.
#
# Paths are joined under `models_root` unless they start with "/". Override the root
# per host with the COLI_MODELS_ROOT env var (so the same registry works on any box).
# `prompt` is the canonical benchmark prompt as token ids: either an inclusive range
# "A..B" (expands to seq A..B) or an explicit space-separated list. `[<name>.convert_env]`
# holds the COLI_* flags `coli convert` needs for that model (empty = defaults).

models_root = "/home/dgx1/models"

# ---------------------------------------------------------------------------
[minimax-m3]
container = "MiniMax-M3-container"
source    = "MiniMax-M3-NVFP4-src"
arch      = "minimax-m3"
prompt    = "100..611"   # 512-token canonical prefill/decode/batch prompt
notes     = "GQA (64Q/4KV, head_dim 128, partial rope 64), 128 experts top-4, sigmoid+bias router, NVFP4 routed experts. Live on 42b2."

[minimax-m3.convert_env]
# NVFP4 experts + int8 resident are the convert defaults — nothing to override.

# ---------------------------------------------------------------------------
# Quoted name (dot). Same GQA family as M3, so most infra is shared.
["minimax-m2.7"]
container = "MiniMax-M2.7-container"
source    = "MiniMax-M2.7-NVFP4-src"
arch      = "minimax-m2"
prompt    = "100..611"
hf_repo   = "nvidia/MiniMax-M2.7-NVFP4"
notes     = "GQA (48Q/8KV, head_dim 128, partial rope 64), 256 experts top-8, plain SwiGLU (silu), per-layer QK-norm, standard RMSNorm, no shared expert, all-MoE. NVFP4 routed. 62 layers, no MTP head in this quant."

["minimax-m2.7".convert_env]
# NVFP4 experts + int8 resident are the convert defaults; no gemma-norm (auto-detected off).

# ---------------------------------------------------------------------------
# NOTE: the name is quoted — TOML reads an unquoted dot as table nesting, so
# [glm-5.2] would parse as glm-5 → 2. Quote any model name containing a dot.
["glm-5.2"]
container = "GLM-5.2-container"
source    = "GLM-5.2-NVFP4-src"
arch      = "glm-moe-dsa"
prompt    = "100..611"
hf_repo   = "Kanposer/GLM-5.2-speedy-colibri-nvfp4"   # complete NVFP4 container (56 files, incl. MTP head) — pull here to re-materialize
notes     = "MLA + DSA lightning indexer, 256 experts top-8, NVFP4 routed. NOT resident on 42b2 right now (disk); container is on HF (hf_repo) — `huggingface-cli download <hf_repo> --local-dir <container>` to restore."

["glm-5.2".convert_env]
COLI_KEEP_INDEXER = "1"   # keep the DSA indexer weights so the container can run sparse attention

# ---------------------------------------------------------------------------
# First non-transformer arch: hybrid Mamba2 (SSM) + GQA + latent-MoE. Auto-detected
# from config.json model_type=nemotron_h, so `arch` here is a label only.
[nemotron-3-super]
container = "Nemotron-3-Super-120B-container"
source    = "Nemotron-3-Super-120B-src"
arch      = "nemotron-h"
# REAL tokens, not the synthetic 100..611 range every other model uses: fed arbitrary
# token ids Nemotron immediately emits stop id 11 (generation_config.json lists
# eos_token_id [2, 11], which config.rs merges into stop_ids), so decode would end
# after 1 token and the decode/batch suites would measure nothing. This is a real
# 512-token passage (coli tokenize) that sustains generation.
prompt    = "1784 6330 1307 23716 6609 1454 17054 22028 10483 1046 8810 1398 23558 1541 9543 1278 12243 92709 14861 1044 1261 4352 10485 17054 8648 1046 63212 41355 1299 1771 9956 1278 2158 11857 13650 1394 2516 1261 8832 1046 1656 1278 51159 8042 1044 15356 32599 12217 17054 10907 1046 22511 86615 12859 2779 1278 22085 1307 34019 1454 1278 86615 8832 1046 1531 31064 1044 58913 1513 17190 99500 1044 3214 32599 10752 1321 17280 1046 79041 31492 7125 1044 1321 2430 1278 104209 1046 29494 36317 1562 99673 20089 1317 2738 3178 19466 18085 1046 87501 6467 13991 21183 5327 21016 9281 1046 70979 8822 20967 5823 1044 12864 17299 1278 18259 1046 1531 6330 1307 23716 6609 1454 17054 22028 10483 1046 8810 1398 23558 1541 9543 1278 12243 92709 14861 1044 1261 4352 10485 17054 8648 1046 63212 41355 1299 1771 9956 1278 2158 11857 13650 1394 2516 1261 8832 1046 1656 1278 51159 8042 1044 15356 32599 12217 17054 10907 1046 22511 86615 12859 2779 1278 22085 1307 34019 1454 1278 86615 8832 1046 1531 31064 1044 58913 1513 17190 99500 1044 3214 32599 10752 1321 17280 1046 79041 31492 7125 1044 1321 2430 1278 104209 1046 29494 36317 1562 99673 20089 1317 2738 3178 19466 18085 1046 87501 6467 13991 21183 5327 21016 9281 1046 70979 8822 20967 5823 1044 12864 17299 1278 18259 1046 1531 6330 1307 23716 6609 1454 17054 22028 10483 1046 8810 1398 23558 1541 9543 1278 12243 92709 14861 1044 1261 4352 10485 17054 8648 1046 63212 41355 1299 1771 9956 1278 2158 11857 13650 1394 2516 1261 8832 1046 1656 1278 51159 8042 1044 15356 32599 12217 17054 10907 1046 22511 86615 12859 2779 1278 22085 1307 34019 1454 1278 86615 8832 1046 1531 31064 1044 58913 1513 17190 99500 1044 3214 32599 10752 1321 17280 1046 79041 31492 7125 1044 1321 2430 1278 104209 1046 29494 36317 1562 99673 20089 1317 2738 3178 19466 18085 1046 87501 6467 13991 21183 5327 21016 9281 1046 70979 8822 20967 5823 1044 12864 17299 1278 18259 1046 1531 6330 1307 23716 6609 1454 17054 22028 10483 1046 8810 1398 23558 1541 9543 1278 12243 