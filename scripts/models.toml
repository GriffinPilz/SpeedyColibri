# Model registry — the single source of truth for the convert/build/bench harness.
#
# Adding a model is three edits:
#   1. crates/colibri-core/src/config.rs  — a new `Arch` variant + config.json detection
#   2. crates/colibri-engine/src/convert.rs — the per-arch tensor mapping
#   3. this file                            — one [<name>] block
# After that, `scripts/pipeline.sh <name>` (convert -> build -> bench) just works,
# and every measurement script takes <name> instead of a hardcoded path.
#
# Paths are joined under `models_root` unless they start with "/". Override the root
# per host with the COLI_MODELS_ROOT env var (so the same registry works on any box).
# `prompt` is the canonical benchmark prompt as token ids: either an inclusive range
# "A..B" (expands to seq A..B) or an explicit space-separated list. `[<name>.convert_env]`
# holds the COLI_* flags `coli convert` needs for that model (empty = defaults).
#
# ALWAYS use a real natural-language passage, never a synthetic id range. Every model
# here carries 512 ids from the same English prose, tokenized with that model's OWN
# tokenizer (`coli tokenize <tokenizer.json> "<text>"`, round-trip verified) and checked
# to sustain generation rather than hit a stop token. Synthetic ranges drive models into
# degenerate repetition, where greedy argmax near-ties flip on harmless FP reassociation
# — so a token-identity gate fires on benign noise. The old "100..611" range produced two
# bogus results before it was replaced (it hit Nemotron's stop token, so whole suites
# measured nothing while their gate still "passed", and it manufactured a GLM correctness
# FAIL that vanished on real text). Repeating one short paragraph to reach length is the
# same trap in milder form: the continuation becomes a copy task. See trap 11 in
# docs/MODEL-TEST-MATRIX.md.
#
# KNOWN INCONSISTENCY: nemotron-3-super's passage below repeats one paragraph, so only
# 87 of its 512 ids are distinct (the other three models carry ~283). It is real text and
# it sustains generation, so it is sound — but it is the copy-task form described above.
# It was deliberately NOT regenerated: every nemotron figure recorded in
# docs/MODEL-TEST-MATRIX.md was measured against this exact prompt, and swapping it would
# invalidate them without anyone noticing. Regenerate it only together with a re-measure.

models_root = "/home/dgx1/models"

