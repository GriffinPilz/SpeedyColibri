[package]
name = "colibri-safetensors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "On-demand safetensors indexing and reads across shards (port of c/st.h)"

[dependencies]
colibri-json = { workspace = true }
colibri-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# io_uring submission for O_DIRECT expert reads (see `drain_jobs_uring`). Linux only:
# the win is O_DIRECT-specific, and O_DIRECT is itself Linux-only here.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"
